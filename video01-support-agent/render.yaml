# Render Blueprint for this demo. In Render: New > Blueprint, pick the repo, and set the
# Blueprint file path to video01-support-agent/render.yaml.
services:
  - type: web
    name: northwind-triage-agent
    runtime: docker
    plan: free
    rootDir: video01-support-agent
    dockerfilePath: ./video01-support-agent/Dockerfile   # relative to the repo root
    dockerContext: ./video01-support-agent
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false   # set the value in the Render dashboard, never in this file
      - key: MODEL
        value: openai/gpt-oss-20b
      - key: SLACK_WEBHOOK_URL
        sync: false
